<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - The Story Petals</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="./favicon.ico" type="image/x-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
    <link rel="preload" href="./tan-pearl.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body class="antialiased flex flex-col min-h-screen bg-[#F9F6F3]">
    <nav class="bg-transparent fixed w-full z-20 top-0 left-0 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="relative flex items-center justify-between h-16">
                <div class="flex items-center w-full justify-center md:w-auto md:justify-start">
                    <a href="index.html" class="font-serif text-3xl" style="color: burlywood;">A</a>
                </div>
                <div class="hidden md:block">
                    <div class="ml-10 flex items-baseline space-x-4">
                        <a href="index.html" class="px-3 py-2 rounded-md text-base font-medium brand-accent">Home</a>
                        <div class="relative">
                            <button id="services-button" aria-haspopup="true" aria-expanded="false" class="px-3 py-2 rounded-md text-base font-medium brand-accent">Services</button>
                            <div id="services-dropdown" class="origin-top-right absolute right-0 mt-2 w-48 rounded-md shadow-lg py-1 bg-white ring-1 ring-black ring-opacity-5 hidden">
                                <a href="events.html" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Events</a>
                                <a href="florals.html" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Florals</a>
                            </div>
                        </div>
                        <a href="about.html" class="px-3 py-2 rounded-md text-base font-medium brand-accent">About Us</a>
                        <a href="contact.html" class="px-3 py-2 rounded-md text-base font-medium brand-accent">Contact</a>
                    </div>
                </div>
                <div class="absolute top-0 right-0 h-full flex items-center md:hidden">
                    <button id="mobile-menu-button" class="hamburger-button" type="button" aria-controls="mobile-menu" aria-expanded="false">
                        <span class="sr-only">Open main menu</span>
                        <span class="hamburger-box">
                            <span class="hamburger-inner"></span>
                        </span>
                    </button>
                </div>
            </div>
        </div>

        <div class="md:hidden hidden" id="mobile-menu">
            <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3 bg-[#F9F6F3]">
                <a href="index.html" class="block px-3 py-2 rounded-md text-base font-medium brand-accent">Home</a>
                <a href="events.html" class="block px-3 py-2 rounded-md text-base font-medium brand-accent">Events</a>
                <a href="florals.html" class="block px-3 py-2 rounded-md text-base font-medium brand-accent">Florals</a>
                <a href="about.html" class="block px-3 py-2 rounded-md text-base font-medium brand-accent">About Us</a>
                <a href="contact.html" class="block px-3 py-2 rounded-md text-base font-medium brand-accent">Contact</a>
            </div>
        </div>
    </nav>
    <main class="flex-grow flex items-center justify-center py-16 px-4 fade-in">
        <div class="max-w-6xl w-full mx-auto grid grid-cols-1 md:grid-cols-2 gap-12 items-center">
            <div class="fade-in-up">
                <h1 class="font-serif text-5xl md:text-7xl text-center md:text-left text-stone-600 mb-12">Get In Touch</h1>
                <form action="#" method="POST" class="space-y-6">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <div>
                            <label for="first-name" class="block text-sm font-medium text-stone-700">First Name</label>
                            <input type="text" name="first-name" id="first-name" required class="mt-1 block w-full px-3 py-2 border border-stone-300 rounded-md shadow-sm focus:outline-none focus:ring-[burlywood] focus:border-[burlywood] sm:text-sm form-input">
                        </div>
                        <div>
                            <label for="last-name" class="block text-sm font-medium text-stone-700">Last Name</label>
                            <input type="text" name="last-name" id="last-name" required class="mt-1 block w-full px-3 py-2 border border-stone-300 rounded-md shadow-sm focus:outline-none focus:ring-[burlywood] focus:border-[burlywood] sm:text-sm form-input">
                        </div>
                    </div>
                    <div>
                        <label for="email" class="block text-sm font-medium text-stone-700">Email</label>
                        <input type="email" name="email" id="email" required class="mt-1 block w-full px-3 py-2 border border-stone-300 rounded-md shadow-sm focus:outline-none focus:ring-[burlywood] focus:border-[burlywood] sm:text-sm form-input">
                    </div>
                    <div>
                        <label for="phone" class="block text-sm font-medium text-stone-700">Phone</label>
                        <input type="tel" name="phone" id="phone" class="mt-1 block w-full px-3 py-2 border border-stone-300 rounded-md shadow-sm focus:outline-none focus:ring-[burlywood] focus:border-[burlywood] sm:text-sm form-input">
                    </div>
                    <div>
                        <label for="event-date" class="block text-sm font-medium text-stone-700">Event Date</label>
                        <input type="date" name="event-date" id="event-date" class="mt-1 block w-full px-3 py-2 border border-stone-300 rounded-md shadow-sm focus:outline-none focus:ring-[burlywood] focus:border-[burlywood] sm:text-sm form-input">
                    </div>
                    <div>
                        <label for="vision" class="block text-sm font-medium text-stone-700">What is your event vision?</label>
                        <textarea id="vision" name="vision" rows="4" class="mt-1 block w-full px-3 py-2 border border-stone-300 rounded-md shadow-sm focus:outline-none focus:ring-[burlywood] focus:border-[burlywood] sm:text-sm form-input"></textarea>
                    </div>
                    <div>
                        <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-[burlywood] hover:bg-[#c9a77d] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[burlywood] transition-colors">
                            Submit
                        </button>
                    </div>
                </form>
            </div>
            <div class="hidden md:flex justify-center items-center fade-in-up" style="transition-delay: 150ms;">
                 <img src="./imgtouch.jpg" alt="Elegant event decor" class="w-full h-auto max-h-[70vh] rounded-lg object-cover" onerror="this.onerror=null;this.src='https://placehold.co/600x800/EFEFEF/AAAAAA?text=Image+Not+Found';">
            </div>
        </div>
    </main>

    <footer class="bg-[#EAE1D7] text-center py-8 px-4">
        <div class="max-w-7xl mx-auto">
            <h3 class="font-serif text-2xl" style="color: #523f2f;">The Story Petals</h3>
            <div class="flex justify-center my-4">
                <a href="https://www.instagram.com/thestorypetals/" target="_blank" rel="noopener noreferrer" class="text-[#523f2f] hover:text-[burlywood] transition-colors duration-300">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                        <rect width="20" height="20" x="2" y="2" rx="5" ry="5" />
                        <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" />
                        <line x1="17.5" x2="17.51" y1="6.5" y2="6.5" />
                    </svg>
                </a>
            </div>
            <p class="text-sm" style="color: #523f2f;">&copy; 2025 The Story Petals. All Rights Reserved.</p>
        </div>
    </footer>
    <script src="script.js"></script>
</body>
</html>
